[package]
name = "sameframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "=0.10.0", default-features = false, features = [
    "asset",
    "compression",
    "discover",
    "font-fontsource",
    "router",
    "serve",
    "tailwind",
    "ui",
    "view",
] }

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["tailwind"] }
