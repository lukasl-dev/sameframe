[package]
name = "sameframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "=0.10.0", default-features = false, features = [
    "asset",
    "compression",
    "discover",
    "router",
    "serve",
    "tailwind",
    "ui",
    "view",
    "websocket",
] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "test-util"] }
tokio-tungstenite = "0.29"

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["tailwind"] }
